<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('hasm_lang') || 'ar';
          if (lang !== 'ar' && lang !== 'en') lang = 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          var meta = document.querySelector('meta[name="description"]');
          if (meta) {
            meta.setAttribute(
              'content',
              lang === 'en'
                ? 'HASM connects business inventory with verified demand and the right channel.'
                : 'منصة حسم لربط مخزون الشركات بالطلب الموثوق والقناة المناسبة.'
            );
          }
          document.title =
            lang === 'en'
              ? 'HASM | B2B Inventory Intelligence'
              : 'حسم | ذكاء المخزون وسوق الأعمال';
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="منصة حسم لربط مخزون الشركات بالطلب الموثوق والقناة المناسبة." />
    <title>حسم | ذكاء المخزون وسوق الأعمال</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
